<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짝사랑</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #fff;
}

img {
    display: block;
    width: 100%;
    height: auto;
}

.video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
}

.video + .video {
    margin-top: 20px;
}

.video iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<img src="02_.jpg" alt="">

<div class="video">
    <iframe
        src="https://www.youtube.com/embed/vWxDjv9DT1Q"
        allowfullscreen>
    </iframe>
</div>

<div class="video">
    <iframe
        src="https://www.youtube.com/embed/92dZRZ-qgi0"
        allowfullscreen>
    </iframe>
</div>

<div class="video">
    <iframe
        src="https://www.youtube.com/embed/_Dm9QIeI-mc"
        allowfullscreen>
    </iframe>
</div>

<div class="video">
    <iframe
        src="https://www.youtube.com/embed/T5Z4CGnXnQM"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
